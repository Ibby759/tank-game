<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #000; overflow: hidden; height: 100vh; }

        #game { width: 100vw; height: 100vh; position: relative; }
        canvas { display: block; width: 100%; height: 100%; }

        .ui { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; }

        /* ULTRA TACTICAL CROSSHAIR */
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            pointer-events: none;
        }

        /* Outer circle (glowing) */
        .crosshair::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border: 2px solid lime;
            border-radius: 50%;
            box-shadow:
                0 0 20px lime,
                inset 0 0 15px rgba(0, 255, 0, 0.3),
                0 0 40px rgba(0, 255, 0, 0.2);
            animation: pulse 2s infinite;
        }

        /* Center dot */
        .crosshair::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, #00ff00 0%, rgba(0, 255, 0, 0.8) 70%);
            border-radius: 50%;
            box-shadow: 0 0 15px lime, 0 0 25px rgba(0, 255, 0, 0.4);
            z-index: 10;
        }

        /* Crosshair animation */
        @keyframes pulse {
            0%, 100% {
                box-shadow:
                    0 0 20px lime,
                    inset 0 0 15px rgba(0, 255, 0, 0.3),
                    0 0 40px rgba(0, 255, 0, 0.2);
            }
            50% {
                box-shadow:
                    0 0 30px lime,
                    inset 0 0 20px rgba(0, 255, 0, 0.5),
                    0 0 60px rgba(0, 255, 0, 0.3);
            }
        }


        /* HUD */
        .hud {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: lime;
            font-size: 20px;
            font-weight: bold;
            font-family: monospace;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border: 2px solid lime;
        }

        .stat { margin: 10px 0; }
        .label { font-size: 14px; color: #888; }

        .top-info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: lime;
            font-size: 18px;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border: 2px solid lime;
        }

        .kills { font-size: 36px; font-weight: bold; }

        /* MINIMAP */
        .minimap {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 200px;
            height: 200px;
            border: 2px solid lime;
            background: rgba(0,0,0,0.8);
        }

        .instruction {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            color: lime;
            padding: 20px;
            border: 2px solid lime;
            font-size: 14px;
            max-width: 300px;
            display: none;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            color: lime;
            padding: 50px;
            border: 3px solid lime;
            text-align: center;
            display: none;
            z-index: 100;
        }

        .game-over h1 {
            font-size: 60px;
            margin-bottom: 30px;
            text-shadow: 0 0 20px lime;
        }

        .game-over p {
            font-size: 24px;
            margin: 20px 0;
        }

        .game-over button {
            background: lime;
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
            pointer-events: all;
        }

        .game-over button:hover {
            background: #00ff00;
        }

        .game-over.show { display: block; }
    </style>
</head>
<body>
    <div id="game">
        <canvas id="canvas"></canvas>
        <div class="ui">
            <div class="crosshair"></div>

            <div class="top-info">
                <div class="kills" id="kills">KILLS: 0</div>
                <div style="font-size: 14px; color: #888; margin-top: 10px;">Destroy the RED TANKS</div>
            </div>

            <!-- MINIMAP -->
            <canvas id="minimap" class="minimap"></canvas>

            <div class="hud">
                <div class="stat">
                    <div class="label">HEALTH</div>
                    <div id="health">100 / 100</div>
                </div>
                <div class="stat">
                    <div class="label">AMMO</div>
                    <div id="ammo">30</div>
                </div>
                <div class="stat">
                    <div class="label">RELOAD</div>
                    <div id="reloadTimer" style="color: #ffff00;">READY</div>
                </div>
            </div>

            <div class="instruction">
                <strong>HOW TO PLAY:</strong><br><br>
                ← → ↑ ↓ = MOVE<br>
                MOUSE = AIM<br>
                CLICK or E = SHOOT<br>
                R = RELOAD / RESTART<br><br>
                <span style="color: #ff4444;">RED = Enemy Tanks</span><br>
                <span style="color: #00ff00;">GREEN = Your Tank</span><br><br>
                Destroy all tanks!
            </div>

            <div class="game-over" id="gameOver">
                <h1>YOU DIED</h1>
                <p id="finalKills">Tanks Destroyed: 0</p>
                <button id="playAgainBtn">PLAY AGAIN</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const miniCanvas = document.getElementById('minimap');
        const ctx = canvas.getContext('2d');
        const miniCtx = miniCanvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        miniCanvas.width = 200;
        miniCanvas.height = 200;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Game state
        const game = {
            player: {
                x: 0, y: 0,
                size: 40,
                health: 100,
                maxHealth: 100,
                ammo: 30,
                maxAmmo: 30,
                angle: 0,
                turretAngle: 0,
                targetTurretAngle: 0,
                kills: 0,
                running: true,
                lastShotTime: 0
            },
            enemies: [],
            bullets: [],
            particles: [],
            terrain: [],
            screenShake: 0,
            screenFlash: 0
        };

        const keys = {};
        let mouseDown = false;
        let shootDelay = 0;
        let reloadTimer = 0;
        let reloadCooldown = 0;
        const RELOAD_TIME = 180; // 3 seconds at 60 FPS
        const RELOAD_COOLDOWN = 600; // 10 seconds at 60 FPS

        // Input
        document.addEventListener('keydown', e => {
            keys[e.key] = true;
            if (e.key.toLowerCase() === 'r') {
                if (game.player.running) {
                    if (reloadTimer <= 0 && reloadCooldown <= 0) {
                        reloadTimer = RELOAD_TIME; // Start 3-second reload
                        reloadCooldown = RELOAD_COOLDOWN; // Start 10-second cooldown
                    }
                } else {
                    location.reload();
                }
            }
            if (e.key === ' ') mouseDown = true;
        });
        document.addEventListener('keyup', e => {
            keys[e.key] = false;
            if (e.key === ' ') mouseDown = false;
        });

        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;

        document.addEventListener('mousemove', e => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        document.addEventListener('mousedown', () => {
            mouseDown = true;
        });
        document.addEventListener('mouseup', () => {
            mouseDown = false;
        });

        // Play Again button
        document.getElementById('playAgainBtn').addEventListener('click', () => {
            location.reload();
        });

        // Draw tank with ULTRA-DETAILED graphics
        function drawTank(x, y, bodyAngle, turretAngle, color) {
            const size = 40;
            const isPlayer = color === '#00ff00';
            const isBlue = color === '#4488ff';

            // Neon glow light effect
            ctx.shadowColor = isPlayer ? 'rgba(0, 255, 136, 0.6)' : (isBlue ? 'rgba(68, 136, 255, 0.6)' : 'rgba(255, 107, 107, 0.6)');
            ctx.shadowBlur = 20;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;

            // Heavy shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.beginPath();
            ctx.ellipse(x, y + size/2 + 5, size/2 + 8, 4, 0, 0, Math.PI * 2);
            ctx.fill();

            // Dual glow effect (enhanced) - different colors for each type
            let glowColor1, glowColor2;
            if (isPlayer) {
                glowColor1 = 'rgba(0, 255, 136, 0.1)';
                glowColor2 = 'rgba(0, 255, 136, 0.2)';
            } else if (isBlue) {
                glowColor1 = 'rgba(68, 136, 255, 0.1)';
                glowColor2 = 'rgba(68, 136, 255, 0.2)';
            } else {
                glowColor1 = 'rgba(255, 107, 107, 0.1)';
                glowColor2 = 'rgba(255, 107, 107, 0.2)';
            }

            ctx.fillStyle = glowColor1;
            ctx.beginPath();
            ctx.arc(x, y, size * 1.2, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = glowColor2;
            ctx.beginPath();
            ctx.arc(x, y, size * 0.7, 0, Math.PI * 2);
            ctx.fill();

            // Body
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(bodyAngle);

            // PROFESSIONAL AAA-QUALITY Tank Body

            // Base metallic body with advanced gradient-like shading
            ctx.fillStyle = color;
            ctx.fillRect(-size/2, -size/2, size, size);

            // Extreme 3D depth with realistic lighting
            // Very dark right edge (deep shadow)
            ctx.fillStyle = isPlayer ? 'rgba(0, 100, 50, 1)' : (isBlue ? 'rgba(20, 40, 110, 1)' : 'rgba(130, 10, 10, 1)');
            for (let i = 0; i < 3; i++) {
                ctx.globalAlpha = 1 - i * 0.25;
                ctx.fillRect(size/2.2 - i, -size/2, 2, size);
            }
            ctx.globalAlpha = 1;

            // Very dark bottom edge
            ctx.fillStyle = isPlayer ? 'rgba(0, 110, 55, 1)' : (isBlue ? 'rgba(25, 45, 120, 1)' : 'rgba(140, 15, 15, 1)');
            for (let i = 0; i < 3; i++) {
                ctx.globalAlpha = 1 - i * 0.25;
                ctx.fillRect(-size/2, size/2.2 - i, size, 2);
            }
            ctx.globalAlpha = 1;

            // Medium shadows for 3D effect
            ctx.fillStyle = isPlayer ? 'rgba(0, 150, 80, 0.4)' : (isBlue ? 'rgba(40, 80, 160, 0.4)' : 'rgba(190, 50, 50, 0.4)');
            ctx.fillRect(size/2.5, -size/2 + 2, size/5, size - 4);
            ctx.fillRect(-size/2 + 2, size/2.5, size - 4, size/5);

            // Armor plating with beveled edges (7 sections)
            ctx.fillStyle = isPlayer ? 'rgba(0, 130, 65, 0.7)' : (isBlue ? 'rgba(35, 65, 155, 0.7)' : 'rgba(170, 30, 30, 0.7)');
            const plateWidth = size / 3.5;
            for (let i = -1; i <= 1; i++) {
                const px = -size/2 + 2 + i * plateWidth + i * 1.5;
                ctx.fillRect(px, -size/2 + 1, plateWidth - 1, size - 2);
            }

            // Rivets/bolts for authentic military look
            ctx.fillStyle = isPlayer ? 'rgba(0, 100, 50, 0.6)' : (isBlue ? 'rgba(20, 40, 120, 0.6)' : 'rgba(120, 15, 15, 0.6)');
            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 4; j++) {
                    const rx = -size/2 + 8 + i * 4;
                    const ry = -size/2 + 6 + j * 8;
                    if (Math.abs(rx) < size/2 - 3 && Math.abs(ry) < size/2 - 3) {
                        ctx.beginPath();
                        ctx.arc(rx, ry, 1.2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            // Ultra-bright specular highlight (metallic reflection - top left)
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.fillRect(-size/2 + 2, -size/2 + 2, size/2.5, size/3.2);

            // Secondary bright highlight
            ctx.fillStyle = 'rgba(255,255,255,0.45)';
            ctx.fillRect(-size/2 + size/2.8, -size/2 + 3, size/3.5, size/2.5);

            // Tertiary mid-tone highlight
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.fillRect(-size/2 + 3, size/2.7, size/3, size/6);

            // Subtle edge lighting (left side bright edge)
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-size/2 + 1, -size/2);
            ctx.lineTo(-size/2 + 1, size/2);
            ctx.stroke();

            // Top edge highlight
            ctx.strokeStyle = 'rgba(255,255,255,0.25)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(-size/2, -size/2 + 1);
            ctx.lineTo(size/2, -size/2 + 1);
            ctx.stroke();

            // Body outline (bright neon)
            let outlineColor;
            if (isPlayer) outlineColor = '#00ff00';
            else if (isBlue) outlineColor = '#4488ff';
            else outlineColor = '#ff4444';
            ctx.strokeStyle = outlineColor;
            ctx.lineWidth = 3;
            ctx.strokeRect(-size/2, -size/2, size, size);

            // Inner edge highlight
            ctx.strokeStyle = isPlayer ? 'rgba(100, 255, 180, 0.6)' : (isBlue ? 'rgba(120, 160, 255, 0.6)' : 'rgba(255, 150, 150, 0.6)');
            ctx.lineWidth = 1.5;
            ctx.strokeRect(-size/2 + 2, -size/2 + 2, size - 4, size - 4);

            // Ultra-detailed treads
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            for (let i = 0; i < 5; i++) {
                ctx.fillRect(-size/2, -size/2.2 + i * size/2.2, size, 2.5);
            }
            // Tread shading
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            for (let i = 0; i < 5; i++) {
                ctx.fillRect(-size/2 + 1, -size/2.2 + i * size/2.2 + 1, size - 2, 1);
            }

            ctx.restore();

            // Turret
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(turretAngle);

            // Turret base ring with glow
            let turretGlow;
            if (isPlayer) turretGlow = 'rgba(0, 255, 136, 0.2)';
            else if (isBlue) turretGlow = 'rgba(68, 136, 255, 0.2)';
            else turretGlow = 'rgba(255, 107, 107, 0.2)';
            ctx.fillStyle = turretGlow;
            ctx.beginPath();
            ctx.arc(0, 0, size/3.2, 0, Math.PI * 2);
            ctx.fill();

            // PROFESSIONAL BARREL - Extreme metallic detail
            // Barrel extreme deep shadow (cylinder effect)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            for (let i = 0; i < 2; i++) {
                ctx.globalAlpha = 1 - i * 0.3;
                ctx.fillRect(-4.9 + i, -size/3, 9.8 - i * 2, size/1.5);
            }
            ctx.globalAlpha = 1;

            // Barrel main body
            ctx.fillStyle = color;
            ctx.fillRect(-5, -size/3, 10, size/1.5);

            // Right side cylinder shadow (extreme 3D)
            ctx.fillStyle = isPlayer ? 'rgba(0, 100, 50, 0.95)' : (isBlue ? 'rgba(20, 40, 110, 0.95)' : 'rgba(130, 10, 10, 0.95)');
            ctx.fillRect(3, -size/3, 2, size/1.5);

            // Barrel mid-shadow
            ctx.fillStyle = isPlayer ? 'rgba(0, 120, 60, 0.6)' : (isBlue ? 'rgba(30, 50, 130, 0.6)' : 'rgba(150, 20, 20, 0.6)');
            ctx.fillRect(1.5, -size/3 + 1, 1.5, size/1.5 - 2);

            // Detailed riflining (8 deep grooves - very realistic)
            ctx.strokeStyle = isPlayer ? 'rgba(0, 130, 65, 0.9)' : (isBlue ? 'rgba(35, 65, 155, 0.9)' : 'rgba(170, 30, 30, 0.9)');
            ctx.lineWidth = 2.2;
            for (let i = 0; i < 8; i++) {
                ctx.beginPath();
                ctx.moveTo(-4.2, -size/3 + 1 + i * size/8.5);
                ctx.lineTo(4.2, -size/3 + 1 + i * size/8.5);
                ctx.stroke();
            }

            // Deep groove shadows for realism
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.lineWidth = 0.8;
            for (let i = 0; i < 8; i++) {
                ctx.beginPath();
                ctx.moveTo(-4.2, -size/3 + 2.5 + i * size/8.5);
                ctx.lineTo(4.2, -size/3 + 2.5 + i * size/8.5);
                ctx.stroke();
            }

            // Ultra-brilliant specular highlight (barrel shine)
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.fillRect(-3.8, -size/3 + 0.5, 7.6, 4);

            // Strong secondary shine (metal reflection)
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.fillRect(-3, -size/3 + 5, 2.5, size/2.2);

            // Tertiary metallic shine
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.fillRect(-0.5, -size/3 + 4, 2, size/1.7);

            // Barrel edge lighting (left side)
            ctx.strokeStyle = 'rgba(255,255,255,0.35)';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(-5, -size/3);
            ctx.lineTo(-5, -size/3 + size/1.5);
            ctx.stroke();

            // Turret outline (thick neon)
            ctx.strokeStyle = outlineColor;
            ctx.lineWidth = 2.5;
            ctx.strokeRect(-5, -size/3, 10, size/1.5);

            // Inner edge highlight
            ctx.strokeStyle = isPlayer ? 'rgba(100, 255, 180, 0.5)' : (isBlue ? 'rgba(120, 160, 255, 0.5)' : 'rgba(255, 150, 150, 0.5)');
            ctx.lineWidth = 1;
            ctx.strokeRect(-4.5, -size/3 + 1, 9, size/1.5 - 2);

            // ULTRA-DETAILED Muzzle
            // Muzzle opening (dark)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(-3, -size/3.2, 6, 2);

            // Muzzle glow/flare
            let muzzleFlare;
            if (isPlayer) muzzleFlare = 'rgba(0, 255, 136, 0.5)';
            else if (isBlue) muzzleFlare = 'rgba(68, 136, 255, 0.5)';
            else muzzleFlare = 'rgba(255, 107, 107, 0.5)';
            ctx.fillStyle = muzzleFlare;
            ctx.fillRect(-3.5, -size/3.5, 7, 2.5);

            // Muzzle highlight
            ctx.fillStyle = isPlayer ? 'rgba(100, 255, 180, 0.4)' : (isBlue ? 'rgba(120, 160, 255, 0.4)' : 'rgba(255, 150, 150, 0.4)');
            ctx.fillRect(-3, -size/3.5 + 0.5, 6, 1);

            ctx.restore();

            // HYPER-REALISTIC Turret Base Ring
            // Deep shadow ring
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.beginPath();
            ctx.arc(x, y, size/3.2, 0, Math.PI * 2);
            ctx.fill();

            // Main turret ring body
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, size/3.5, 0, Math.PI * 2);
            ctx.fill();

            // Ring 3D shading (bottom shadow)
            ctx.fillStyle = isPlayer ? 'rgba(0, 120, 60, 0.7)' : (isBlue ? 'rgba(30, 50, 130, 0.7)' : 'rgba(150, 20, 20, 0.7)');
            ctx.beginPath();
            ctx.moveTo(x - size/3.5, y);
            ctx.arc(x, y, size/3.5, 0, Math.PI);
            ctx.lineTo(x + size/3.5, y);
            ctx.fill();

            // Ring ultra-bright shine (top-left)
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.beginPath();
            ctx.arc(x - 4, y - 4, size/4.8, 0, Math.PI * 2);
            ctx.fill();

            // Secondary shine
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.beginPath();
            ctx.arc(x - 2, y - 4, size/6, 0, Math.PI * 2);
            ctx.fill();

            // Turret ring grooves (rotation marks)
            ctx.strokeStyle = isPlayer ? 'rgba(0, 200, 100, 0.5)' : (isBlue ? 'rgba(60, 100, 200, 0.5)' : 'rgba(200, 50, 50, 0.5)');
            ctx.lineWidth = 1;
            for (let i = 0; i < 8; i++) {
                const angle = (Math.PI * 2 * i) / 8;
                const x1 = x + Math.cos(angle) * size/4.2;
                const y1 = y + Math.sin(angle) * size/4.2;
                const x2 = x + Math.cos(angle) * size/3.2;
                const y2 = y + Math.sin(angle) * size/3.2;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }

            // Turret base outer outline (neon)
            ctx.strokeStyle = outlineColor;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(x, y, size/3.5, 0, Math.PI * 2);
            ctx.stroke();

            // Turret ring inner circle (glowing)
            let innerCircleColor;
            if (isPlayer) innerCircleColor = '#00dd66';
            else if (isBlue) innerCircleColor = '#5599ff';
            else innerCircleColor = '#ff6666';
            ctx.strokeStyle = innerCircleColor;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(x, y, size/5.2, 0, Math.PI * 2);
            ctx.stroke();

            // Inner detail ring
            ctx.strokeStyle = isPlayer ? 'rgba(100, 255, 180, 0.5)' : (isBlue ? 'rgba(120, 160, 255, 0.5)' : 'rgba(255, 150, 150, 0.5)');
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(x, y, size/6.5, 0, Math.PI * 2);
            ctx.stroke();

            // Center indicator (bright)
            ctx.fillStyle = outlineColor;
            ctx.beginPath();
            ctx.arc(x, y, 4.5, 0, Math.PI * 2);
            ctx.fill();

            // Center core glow
            ctx.fillStyle = isPlayer ? 'rgba(100, 255, 180, 0.7)' : (isBlue ? 'rgba(120, 160, 255, 0.7)' : 'rgba(255, 150, 150, 0.7)');
            ctx.beginPath();
            ctx.arc(x, y, 2.5, 0, Math.PI * 2);
            ctx.fill();

            // Center outline
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(x, y, 4.5, 0, Math.PI * 2);
            ctx.stroke();

            // Clear shadow for next element
            ctx.shadowColor = 'transparent';
        }

        // Enemy class
        class Enemy {
            constructor() {
                const angle = Math.random() * Math.PI * 2;
                const dist = 250 + Math.random() * 150;
                this.x = game.player.x + Math.cos(angle) * dist;
                this.y = game.player.y + Math.sin(angle) * dist;
                this.size = 40;
                this.health = 50;
                this.maxHealth = 50;
                this.speed = 0.8 + Math.random() * 0.4;
                this.angle = Math.random() * Math.PI * 2;
                this.turretAngle = this.angle;
                this.targetTurretAngle = this.angle;
                this.shootTimer = 0;

                // 40% chance to be blue (fast-shooting variant)
                this.isBlue = Math.random() < 0.4;
                this.color = this.isBlue ? '#4488ff' : '#ff4444';
                this.shootCooldown = this.isBlue ? 30 : 60; // Blue tanks shoot faster
            }

            update() {
                // Don't update dead tanks
                if (this.health <= 0) return;

                const dx = game.player.x - this.x;
                const dy = game.player.y - this.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                // Move toward player (smoother)
                if (dist > 0) {
                    const moveAngle = Math.atan2(dy, dx);
                    this.x += Math.cos(moveAngle) * this.speed;
                    this.y += Math.sin(moveAngle) * this.speed;
                    this.angle += (moveAngle - this.angle) * 0.1;
                }

                // Smooth turret rotation
                const tdx = game.player.x - this.x;
                const tdy = game.player.y - this.y;
                this.targetTurretAngle = Math.atan2(tdy, tdx);
                this.turretAngle += (this.targetTurretAngle - this.turretAngle) * 0.1;

                // Shoot (blue tanks shoot faster and fat bullets)
                this.shootTimer++;
                if (this.shootTimer > this.shootCooldown && dist < 300) {
                    game.bullets.push({
                        x: this.x,
                        y: this.y,
                        vx: Math.cos(this.turretAngle) * 4,
                        vy: Math.sin(this.turretAngle) * 4,
                        damage: 20,
                        isPlayerBullet: false,
                        isBlue: this.isBlue,
                        size: this.isBlue ? 8 : 5
                    });
                    this.shootTimer = 0;
                }
            }

            draw() {
                if (this.health <= 0) return;

                const screenX = canvas.width / 2 + (this.x - game.player.x);
                const screenY = canvas.height / 2 + (this.y - game.player.y);

                drawTank(screenX, screenY, this.angle, this.turretAngle, this.color);

                // Health bar
                const barWidth = 50;
                const barHeight = 6;
                ctx.fillStyle = '#ff0000';
                const healthPercent = (this.health / this.maxHealth) * barWidth;
                ctx.fillRect(screenX - barWidth/2, screenY - 35, healthPercent, barHeight);
                ctx.strokeStyle = '#ff6b6b';
                ctx.lineWidth = 1;
                ctx.strokeRect(screenX - barWidth/2, screenY - 35, barWidth, barHeight);
            }
        }

        function shoot() {
            if (game.player.ammo <= 0 || shootDelay > 0) return;

            game.player.ammo--;
            shootDelay = 10;
            game.player.lastShotTime = 5;
            game.screenFlash = 0.3;

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const dx = mouseX - cx;
            const dy = mouseY - cy;
            const angle = Math.atan2(dy, dx);

            game.bullets.push({
                x: game.player.x,
                y: game.player.y,
                vx: Math.cos(angle) * 8,
                vy: Math.sin(angle) * 8,
                damage: 30,
                isPlayerBullet: true,
                life: 300
            });

            // Muzzle flash particles
            for (let i = 0; i < 8; i++) {
                const flashAngle = angle + (Math.random() - 0.5) * 0.6;
                game.particles.push({
                    x: game.player.x + Math.cos(angle) * 20,
                    y: game.player.y + Math.sin(angle) * 20,
                    vx: Math.cos(flashAngle) * (5 + Math.random() * 4),
                    vy: Math.sin(flashAngle) * (5 + Math.random() * 4),
                    life: 10,
                    maxLife: 10,
                    type: 'muzzle'
                });
            }

            document.getElementById('ammo').textContent = game.player.ammo;
        }

        function update() {
            if (!game.player.running) return;

            shootDelay--;

            // Update reload timer and cooldown
            if (reloadTimer > 0) {
                reloadTimer--;
            }
            if (reloadCooldown > 0) {
                reloadCooldown--;
            }
            if (reloadTimer <= 0 && reloadTimer !== -1) {
                if (game.player.ammo < game.player.maxAmmo) {
                    game.player.ammo = game.player.maxAmmo;
                    document.getElementById('ammo').textContent = game.player.ammo;
                }
                reloadTimer = -1; // Mark as complete
            }

            // Player movement - DIRECT (no drift)
            const moveSpeed = 2.5;

            if (keys['ArrowUp'] || keys['w'] || keys['W']) game.player.y -= moveSpeed;
            if (keys['ArrowDown'] || keys['s'] || keys['S']) game.player.y += moveSpeed;
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) game.player.x -= moveSpeed;
            if (keys['ArrowRight'] || keys['d'] || keys['D']) game.player.x += moveSpeed;

            // Tank angle
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const pdx = mouseX - cx;
            const pdy = mouseY - cy;
            game.player.targetTurretAngle = Math.atan2(pdy, pdx);

            // Smooth turret rotation
            const angleDiff = game.player.targetTurretAngle - game.player.turretAngle;
            game.player.turretAngle += angleDiff * 0.35;

            // Update screen shake
            game.screenShake *= 0.85;

            // Shooting
            if (mouseDown) shoot();

            // Update enemies
            game.enemies.forEach(e => e.update());

            // Update bullets
            for (let i = game.bullets.length - 1; i >= 0; i--) {
                const b = game.bullets[i];
                b.x += b.vx;
                b.y += b.vy;
                b.life = b.life ? b.life - 1 : 500;

                if (b.life <= 0) {
                    game.bullets.splice(i, 1);
                    continue;
                }

                if (b.isPlayerBullet) {
                    game.enemies.forEach(e => {
                        if (e.health <= 0) return;
                        const dx = b.x - e.x;
                        const dy = b.y - e.y;
                        if (Math.sqrt(dx*dx + dy*dy) < e.size/2) {
                            e.health -= b.damage;
                            b.life = 0;

                            if (e.health <= 0) {
                                game.player.kills++;
                                document.getElementById('kills').textContent = 'KILLS: ' + game.player.kills;

                                // Screen shake on kill
                                game.screenShake = 8;

                                // Enhanced explosion effect with more particles
                                // Main explosion spheres
                                for (let j = 0; j < 10; j++) {
                                    const angle = (Math.PI * 2 * j) / 10;
                                    const speed = 4 + Math.random() * 4;
                                    game.particles.push({
                                        x: e.x,
                                        y: e.y,
                                        vx: Math.cos(angle) * speed,
                                        vy: Math.sin(angle) * speed,
                                        life: 40,
                                        maxLife: 40,
                                        type: 'smoke',
                                        size: 10 + Math.random() * 6
                                    });
                                }
                                // Spark trails
                                for (let j = 0; j < 6; j++) {
                                    game.particles.push({
                                        x: e.x,
                                        y: e.y,
                                        vx: (Math.random() - 0.5) * 14,
                                        vy: (Math.random() - 0.5) * 14,
                                        life: 22,
                                        maxLife: 22,
                                        type: 'spark'
                                    });
                                }
                                // Debris
                                for (let j = 0; j < 3; j++) {
                                    game.particles.push({
                                        x: e.x,
                                        y: e.y,
                                        vx: (Math.random() - 0.5) * 10,
                                        vy: (Math.random() - 0.5) * 10 - 2,
                                        life: 35,
                                        maxLife: 35,
                                        type: 'debris'
                                    });
                                }
                            }
                        }
                    });
                } else {
                    const dx = b.x - game.player.x;
                    const dy = b.y - game.player.y;
                    if (Math.sqrt(dx*dx + dy*dy) < game.player.size/2) {
                        game.player.health -= b.damage;
                        b.life = 0;

                        if (game.player.health <= 0) {
                            game.player.running = false;
                            document.getElementById('finalKills').textContent = 'Tanks Destroyed: ' + game.player.kills;
                            document.getElementById('gameOver').classList.add('show');
                        }
                    }
                }
            }

            // Update particles (cap at 100)
            game.particles = game.particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                return p.life > 0;
            }).slice(-100);

            // Regenerate terrain
            generateTerrain();

            // Spawn enemies (heavily optimized)
            const liveEnemies = game.enemies.filter(e => e.health > 0);
            if (liveEnemies.length < 1 && Math.random() < 0.05) {
                game.enemies.push(new Enemy());
            }

            // Remove far away enemies to save performance
            game.enemies = game.enemies.filter(e => {
                const dx = e.x - game.player.x;
                const dy = e.y - game.player.y;
                return Math.sqrt(dx*dx + dy*dy) < 500;
            });

            // Update UI
            document.getElementById('health').textContent = Math.round(game.player.health) + ' / ' + game.player.maxHealth;

            // Update reload timer display
            if (reloadTimer > 0) {
                const reloadSeconds = (reloadTimer / 60).toFixed(1);
                document.getElementById('reloadTimer').textContent = reloadSeconds + 's';
                document.getElementById('reloadTimer').style.color = '#ff6666';
            } else if (reloadCooldown > 0) {
                const cooldownSeconds = (reloadCooldown / 60).toFixed(1);
                document.getElementById('reloadTimer').textContent = cooldownSeconds + 's';
                document.getElementById('reloadTimer').style.color = '#ffaa00';
            } else {
                document.getElementById('reloadTimer').textContent = 'READY';
                document.getElementById('reloadTimer').style.color = '#ffff00';
            }
        }

        function draw() {
            // ULTRA-PREMIUM gradient background with multiple layers
            const bgGradient = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, 0, canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height) * 0.8);
            bgGradient.addColorStop(0, '#2a2a3e');
            bgGradient.addColorStop(0.4, '#1a1a2e');
            bgGradient.addColorStop(0.7, '#0f0f20');
            bgGradient.addColorStop(1, '#050508');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Multiple atmospheric layers
            // Green tint overlay (subtle)
            ctx.fillStyle = 'rgba(0, 255, 100, 0.03)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Cyan atmosphere layer
            ctx.fillStyle = 'rgba(0, 200, 255, 0.01)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Noise pattern (subtle texture)
            for (let i = 0; i < 100; i++) {
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.02})`;
                ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 1, 1);
            }

            let cx = canvas.width / 2;
            let cy = canvas.height / 2;

            // Apply screen shake
            if (game.screenShake > 0.5) {
                cx += (Math.random() - 0.5) * game.screenShake;
                cy += (Math.random() - 0.5) * game.screenShake;
            }

            // Decay screen effects
            game.screenShake *= 0.92;
            game.screenFlash *= 0.88;

            // Draw terrain obstacles (ultra-enhanced visuals)
            game.terrain.forEach(t => {
                const screenX = cx + (t.x - game.player.x);
                const screenY = cy + (t.y - game.player.y);

                if (Math.abs(screenX - cx) < 600 && Math.abs(screenY - cy) < 600) {
                    // Double shadow for depth
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                    ctx.fillRect(screenX - t.size/2 + 1, screenY - t.size/2 + 5, t.size, t.size);
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                    ctx.fillRect(screenX - t.size/2 + 3, screenY - t.size/2 + 7, t.size - 2, t.size - 2);

                    // Glow aura
                    ctx.fillStyle = 'rgba(0, 255, 136, 0.15)';
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, t.size * 0.7, 0, Math.PI * 2);
                    ctx.fill();

                    // Main body with gradient
                    ctx.fillStyle = '#2d7a3e';
                    ctx.fillRect(screenX - t.size/2, screenY - t.size/2, t.size, t.size);

                    // Texture pattern
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                    for (let i = 0; i < 3; i++) {
                        ctx.fillRect(screenX - t.size/2 + i * 13, screenY - t.size/2, 3, t.size);
                    }

                    // Dark side (3D effect - enhanced)
                    ctx.fillStyle = '#1a4024';
                    ctx.fillRect(screenX + t.size/2 - 10, screenY - t.size/2, 10, t.size);
                    ctx.fillRect(screenX - t.size/2, screenY + t.size/2 - 10, t.size, 10);

                    // Shine top (enhanced)
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
                    ctx.fillRect(screenX - t.size/2 + 2, screenY - t.size/2 + 2, t.size - 4, 5);

                    // Corner highlights
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                    ctx.beginPath();
                    ctx.arc(screenX - t.size/2 + 3, screenY - t.size/2 + 3, 2, 0, Math.PI * 2);
                    ctx.fill();

                    // Border glow (thicker)
                    ctx.shadowColor = 'rgba(0, 255, 136, 0.5)';
                    ctx.shadowBlur = 8;
                    ctx.strokeStyle = '#00ff88';
                    ctx.lineWidth = 2.5;
                    ctx.strokeRect(screenX - t.size/2, screenY - t.size/2, t.size, t.size);
                    ctx.shadowColor = 'transparent';

                    // Inner highlight
                    ctx.strokeStyle = 'rgba(0, 255, 136, 0.6)';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(screenX - t.size/2 + 2, screenY - t.size/2 + 2, t.size - 4, t.size - 4);
                }
            });

            // Simple grid lines (no calculations, just visual)
            ctx.strokeStyle = 'rgba(0, 255, 100, 0.1)';
            ctx.lineWidth = 1;
            for (let i = -3; i <= 3; i++) {
                ctx.beginPath();
                ctx.moveTo(cx + i * 150, cy - 450);
                ctx.lineTo(cx + i * 150, cy + 450);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx - 450, cy + i * 150);
                ctx.lineTo(cx + 450, cy + i * 150);
                ctx.stroke();
            }

            // Draw enemies
            game.enemies.forEach(e => e.draw());

            // Draw bullets with motion blur
            game.bullets.forEach(b => {
                const screenX = cx + (b.x - game.player.x);
                const screenY = cy + (b.y - game.player.y);

                if (b.isPlayerBullet) {
                    // Enhanced motion blur trail with multiple layers
                    // Far trail (faint)
                    ctx.strokeStyle = 'rgba(255, 255, 0, 0.1)';
                    ctx.lineWidth = 6;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(screenX - b.vx * 4, screenY - b.vy * 4);
                    ctx.lineTo(screenX - b.vx * 2, screenY - b.vy * 2);
                    ctx.stroke();

                    // Near trail (brighter)
                    ctx.strokeStyle = 'rgba(255, 255, 0, 0.3)';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(screenX - b.vx * 2, screenY - b.vy * 2);
                    ctx.lineTo(screenX, screenY);
                    ctx.stroke();

                    // Outer glow (large)
                    ctx.fillStyle = 'rgba(255, 255, 100, 0.3)';
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, 14, 0, Math.PI * 2);
                    ctx.fill();

                    // Mid glow
                    ctx.fillStyle = 'rgba(255, 255, 150, 0.4)';
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, 8, 0, Math.PI * 2);
                    ctx.fill();

                    // Main bullet (bright)
                    ctx.fillStyle = '#ffff00';
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, 5, 0, Math.PI * 2);
                    ctx.fill();

                    // Inner bright core
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                } else if (b.isBlue) {
                    // Blue bullet (FAT) - bigger and stronger looking
                    const size = b.size || 8;

                    // Motion blur trail (thicker)
                    ctx.strokeStyle = 'rgba(68, 136, 255, 0.25)';
                    ctx.lineWidth = 6;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(screenX - b.vx * 2, screenY - b.vy * 2);
                    ctx.lineTo(screenX, screenY);
                    ctx.stroke();

                    // Outer glow (larger)
                    ctx.fillStyle = 'rgba(68, 136, 255, 0.5)';
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, size + 6, 0, Math.PI * 2);
                    ctx.fill();

                    // Main bullet (FAT)
                    ctx.fillStyle = '#4488ff';
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, size, 0, Math.PI * 2);
                    ctx.fill();

                    // Inner glow
                    ctx.fillStyle = '#88bbff';
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, size * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // Red bullet motion blur
                    const size = b.size || 5;

                    ctx.strokeStyle = 'rgba(255, 68, 68, 0.2)';
                    ctx.lineWidth = 4;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(screenX - b.vx * 2, screenY - b.vy * 2);
                    ctx.lineTo(screenX, screenY);
                    ctx.stroke();

                    // Outer glow
                    ctx.fillStyle = 'rgba(255, 107, 107, 0.4)';
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, 10, 0, Math.PI * 2);
                    ctx.fill();

                    // Main bullet
                    ctx.fillStyle = '#ff6b6b';
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, size, 0, Math.PI * 2);
                    ctx.fill();

                    // Inner glow
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Draw particles (ultra-enhanced with glows)
            game.particles.forEach(p => {
                const screenX = cx + (p.x - game.player.x);
                const screenY = cy + (p.y - game.player.y);

                if (p.type === 'smoke') {
                    // Ultra-detailed smoke explosion with multi-layer glow
                    const alpha = (p.life / p.maxLife) * 0.8;
                    const size = (p.size || 12) * (1 - (p.maxLife - p.life) / p.maxLife * 0.3);

                    // Outermost glow (red)
                    ctx.fillStyle = `rgba(255, 100, 50, ${alpha * 0.2})`;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, size * 1.6, 0, Math.PI * 2);
                    ctx.fill();

                    // Outer glow (orange)
                    ctx.fillStyle = `rgba(255, 150, 50, ${alpha * 0.35})`;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, size * 1.3, 0, Math.PI * 2);
                    ctx.fill();

                    // Main smoke (yellow-orange)
                    ctx.fillStyle = `rgba(255, 200, 100, ${alpha * 0.95})`;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, size, 0, Math.PI * 2);
                    ctx.fill();

                    // Mid core (lighter)
                    ctx.fillStyle = `rgba(255, 220, 140, ${alpha * 0.7})`;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, size * 0.7, 0, Math.PI * 2);
                    ctx.fill();

                    // Inner core (brightest)
                    ctx.fillStyle = `rgba(255, 240, 180, ${alpha * 0.8})`;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, size * 0.35, 0, Math.PI * 2);
                    ctx.fill();
                } else if (p.type === 'spark') {
                    // Ultra-bright sparks with brilliant trails
                    const alpha = p.life / p.maxLife;

                    // Outer glow halo
                    ctx.fillStyle = `rgba(255, 255, 100, ${alpha * 0.25})`;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, 8, 0, Math.PI * 2);
                    ctx.fill();

                    // Inner glow
                    ctx.fillStyle = `rgba(255, 255, 150, ${alpha * 0.4})`;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, 5, 0, Math.PI * 2);
                    ctx.fill();

                    // Spark core (bright)
                    ctx.fillStyle = `rgba(255, 255, 200, ${alpha * 1})`;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, 2.5, 0, Math.PI * 2);
                    ctx.fill();

                    // Double trail lines
                    ctx.strokeStyle = `rgba(255, 220, 100, ${alpha * 0.7})`;
                    ctx.lineWidth = 2;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(screenX, screenY);
                    ctx.lineTo(screenX - p.vx * 4, screenY - p.vy * 4);
                    ctx.stroke();

                    // Inner trail (lighter)
                    ctx.strokeStyle = `rgba(255, 240, 150, ${alpha * 0.4})`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(screenX - 0.5, screenY - 0.5);
                    ctx.lineTo(screenX - p.vx * 3, screenY - p.vy * 3);
                    ctx.stroke();
                } else if (p.type === 'debris') {
                    // Debris pieces with glow
                    const alpha = p.life / p.maxLife;

                    // Glow
                    ctx.fillStyle = `rgba(255, 150, 80, ${alpha * 0.2})`;
                    ctx.fillRect(screenX - 5, screenY - 5, 10, 10);

                    // Main debris
                    ctx.fillStyle = `rgba(220, 120, 60, ${alpha})`;
                    ctx.fillRect(screenX - 3, screenY - 3, 6, 6);

                    // Highlight
                    ctx.strokeStyle = `rgba(255, 180, 100, ${alpha * 0.8})`;
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(screenX - 3, screenY - 3, 6, 6);
                } else if (p.type === 'muzzle') {
                    // Muzzle flash (brilliant bright effect)
                    const alpha = p.life / p.maxLife;

                    // Ultra-bright glow halo
                    ctx.fillStyle = `rgba(255, 200, 100, ${alpha * 0.4})`;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, 12, 0, Math.PI * 2);
                    ctx.fill();

                    // Bright core
                    ctx.fillStyle = `rgba(255, 255, 150, ${alpha * 0.8})`;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, 6, 0, Math.PI * 2);
                    ctx.fill();

                    // Inner bright white
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Draw player
            drawTank(cx, cy, 0, game.player.turretAngle, '#00ff00');

            // Ultra-enhanced vignette effect (multi-layer)
            // Inner vignette (subtle green)
            const vignetteGradient1 = ctx.createRadialGradient(cx, cy, 150, cx, cy, Math.max(canvas.width, canvas.height) * 0.8);
            vignetteGradient1.addColorStop(0, 'rgba(0, 255, 100, 0.05)');
            vignetteGradient1.addColorStop(1, 'rgba(0, 255, 100, 0)');
            ctx.fillStyle = vignetteGradient1;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Outer vignette (dark)
            const vignetteGradient2 = ctx.createRadialGradient(cx, cy, 100, cx, cy, Math.max(canvas.width, canvas.height));
            vignetteGradient2.addColorStop(0, 'rgba(0, 0, 0, 0)');
            vignetteGradient2.addColorStop(0.7, 'rgba(0, 0, 0, 0.2)');
            vignetteGradient2.addColorStop(1, 'rgba(0, 0, 0, 0.5)');
            ctx.fillStyle = vignetteGradient2;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Center cross indicator (enhanced)
            ctx.strokeStyle = 'rgba(0, 255, 100, 0.2)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 3]);
            ctx.beginPath();
            ctx.moveTo(cx, cy - 35);
            ctx.lineTo(cx, cy + 35);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(cx - 35, cy);
            ctx.lineTo(cx + 35, cy);
            ctx.stroke();

            // Center circle indicator
            ctx.strokeStyle = 'rgba(0, 255, 100, 0.15)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(cx, cy, 15, 0, Math.PI * 2);
            ctx.stroke();

            ctx.setLineDash([]);

            // Screen flash effect (when shooting)
            if (game.screenFlash > 0) {
                ctx.fillStyle = `rgba(255, 255, 200, ${game.screenFlash * 0.3})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        function drawMinimap() {
            // Background
            miniCtx.fillStyle = '#0a0a1a';
            miniCtx.fillRect(0, 0, 200, 200);

            // Grid pattern
            miniCtx.strokeStyle = 'rgba(0, 255, 0, 0.1)';
            miniCtx.lineWidth = 0.5;
            for (let i = 0; i <= 4; i++) {
                miniCtx.beginPath();
                miniCtx.moveTo(i * 50, 0);
                miniCtx.lineTo(i * 50, 200);
                miniCtx.stroke();
                miniCtx.beginPath();
                miniCtx.moveTo(0, i * 50);
                miniCtx.lineTo(200, i * 50);
                miniCtx.stroke();
            }

            const scale = 0.3;
            const centerX = 100;
            const centerY = 100;

            // Enemies
            game.enemies.forEach(e => {
                if (e.health > 0) {
                    // Enemy glow
                    miniCtx.fillStyle = 'rgba(255, 68, 68, 0.3)';
                    miniCtx.beginPath();
                    miniCtx.arc(centerX + e.x * scale, centerY + e.y * scale, 6, 0, Math.PI * 2);
                    miniCtx.fill();

                    // Enemy
                    miniCtx.fillStyle = '#ff4444';
                    miniCtx.fillRect(centerX + e.x * scale - 4, centerY + e.y * scale - 4, 8, 8);
                }
            });

            // Player glow
            miniCtx.fillStyle = 'rgba(0, 255, 136, 0.3)';
            miniCtx.beginPath();
            miniCtx.arc(centerX, centerY, 6, 0, Math.PI * 2);
            miniCtx.fill();

            // Player
            miniCtx.fillStyle = '#00ff88';
            miniCtx.fillRect(centerX - 4, centerY - 4, 8, 8);

            // Direction indicator
            miniCtx.strokeStyle = '#00ff88';
            miniCtx.lineWidth = 2;
            miniCtx.beginPath();
            miniCtx.moveTo(centerX, centerY);
            miniCtx.lineTo(centerX + Math.cos(game.player.turretAngle) * 15, centerY + Math.sin(game.player.turretAngle) * 15);
            miniCtx.stroke();

            // Border
            miniCtx.strokeStyle = 'rgba(0, 255, 136, 0.5)';
            miniCtx.lineWidth = 2;
            miniCtx.strokeRect(0, 0, 200, 200);
        }

        // Generate terrain (much larger chunks, less lag)
        let lastTerrainX = 0;
        let lastTerrainY = 0;
        function generateTerrain() {
            const chunkSize = 600;
            const px = Math.floor(game.player.x / chunkSize);
            const py = Math.floor(game.player.y / chunkSize);

            if (px === lastTerrainX && py === lastTerrainY) return;

            lastTerrainX = px;
            lastTerrainY = py;

            game.terrain = [];
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    const bx = (px + i) * chunkSize + 150;
                    const by = (py + j) * chunkSize + 150;
                    game.terrain.push({ x: bx, y: by, size: 40 });
                    game.terrain.push({ x: bx + 300, y: by + 300, size: 40 });
                }
            }
        }

        // Spawn initial enemies (reduced for performance)
        for (let i = 0; i < 1; i++) {
            game.enemies.push(new Enemy());
        }

        generateTerrain();

        let frameCount = 0;
        function gameLoop() {
            update();
            draw();

            // Draw minimap every 2 frames (performance optimization)
            if (frameCount % 2 === 0) {
                drawMinimap();
            }
            frameCount++;

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
